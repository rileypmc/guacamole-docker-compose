services:
  guac-init:
    image: guacamole/guacamole:1.6.0
    container_name: guac-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/guacamole/bin/initdb.sh --postgresql > /init/initdb.sql
    volumes:
      - initdb:/init

  postgresql:
    image: postgres:15
    container_name: postgres-guac
    restart: unless-stopped
    depends_on:
      guac-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${GUAC_DB_PASSWORD:?Password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole_user -d guacamole_db -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - guac_network

  guacamole:
    image: guacamole/guacamole:1.6.0
    container_name: guacamole
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USERNAME: guacamole_user
      POSTGRESQL_PASSWORD: ${GUAC_DB_PASSWORD:?Password required}
      POSTGRESQL_HOSTNAME: postgresql
      POSTGRESQL_ENABLED: "true"
      GUACD_HOSTNAME: guacd
    ports:
      - "8085:8080"
    networks:
      - guac_network

  guacd:
    image: guacamole/guacd:1.6.0
    container_name: guacd
    restart: unless-stopped
    networks:
      - guac_network

volumes:
  initdb:
  postgres_data:

networks:
  guac_network:
    driver: bridge
